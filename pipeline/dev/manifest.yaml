apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: legisai-platform
spec:
  ports:
  - port: 9020
    protocol: TCP
    targetPort: 9020
  selector:
    app: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: webapp
  name: webapp
  namespace: legisai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - image: legisaiacrdev.azurecr.io/webapp:47d9925
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /
            port: 9020
          initialDelaySeconds: 30
        name: webapp
        ports:
        - containerPort: 9020
        readinessProbe:
          httpGet:
            path: /
            port: 9020
          initialDelaySeconds: 30
        resources:
          limits:
            cpu: 256m
            memory: 512Mi
